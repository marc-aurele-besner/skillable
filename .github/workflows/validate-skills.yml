name: Validate skills

on:
  pull_request:
    paths:
      - "skills/**"
      - "templates/**"
      - "README.md"
      - "CONTRIBUTING.md"
      - "scripts/validate_skills.py"
      - ".github/workflows/validate-skills.yml"
  push:
    branches: [main]
    paths:
      - "skills/**"
      - "templates/**"
      - "README.md"
      - "CONTRIBUTING.md"
      - "scripts/validate_skills.py"
      - ".github/workflows/validate-skills.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-skills-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Structure, formatting, and README
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch pull request base
        if: github.event_name == 'pull_request'
        run: git fetch --no-tags origin ${{ github.event.pull_request.base.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate skills
        env:
          SKILLABLE_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python scripts/validate_skills.py
